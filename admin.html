<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة المدير - طلبات المدينة</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f3f5f8;color:#222}
header{background:#102a43;color:white;text-align:center;padding:20px}
main{padding:15px;max-width:700px;margin:auto}
.card{background:white;padding:16px;margin:12px 0;border-radius:12px}
h2{color:#102a43}
button{background:#16834a;color:white;border:0;padding:12px;border-radius:8px;width:100%;font-size:16px}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}
#message{color:#b42318}
</style>
</head>
<body>
<header>
<h2>طلبات المدينة</h2>
<p>لوحة تحكم المدير</p>
</header>
<main>
<div class="card">
<h3>دخول المدير</h3>
<input id="email" type="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">
<button onclick="login()">دخول</button>
<p id="message"></p>
</div>
<div class="card" id="dashboard" hidden>
<h3>لوحة التحكم</h3>
<p>تم تسجيل الدخول بنجاح.</p>
<button onclick="logout()">تسجيل الخروج</button>
</div>
</main>
<script>
function login(){
 document.getElementById("message").textContent =
 "نظام دخول المدير يحتاج إلى إعداد حساب آمن أولاً.";
}
function logout(){
 document.getElementById("dashboard").hidden=true;
}
</script>
</body>
</html>
