<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة المدير - طلبات المدينة</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f3f5f8;color:#222}
header{background:#102a43;color:white;text-align:center;padding:20px}
main{padding:15px;max-width:700px;margin:auto}
.card{background:white;padding:16px;margin:12px 0;border-radius:12px}
button{background:#16834a;color:white;border:0;padding:12px;border-radius:8px;width:100%;font-size:15px;margin-top:8px}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}
#message{color:#b42318}
.order{background:#f3f5f8;padding:12px;margin:10px 0;border-radius:8px}
.product{background:white;padding:10px;margin:7px 0;border-radius:8px}
.delivery{background:#245b9e}
.done{background:#16834a}
.cancel{background:#b42318}
.details{border-top:1px solid #ddd;margin-top:12px;padding-top:10px}
</style>
</head>

<body>

<header>
<h2>طلبات المدينة</h2>
<p>لوحة تحكم المدير</p>
</header>

<main>

<div class="card" id="loginBox">
<h3>دخول المدير</h3>
<input id="email" type="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">
<button onclick="login()">دخول</button>
<p id="message"></p>
</div>

<div class="card" id="dashboard" hidden>
<h3>لوحة التحكم</h3>
<p id="status">الطلبات</p>
<div id="orders"></div>
<button onclick="loadOrders()">تحديث الطلبات</button>
<button onclick="logout()">تسجيل الخروج</button>
</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL="https://iombzxymujzetguqdhkq.supabase.co";

/* ضع مفتاح Publishable الخاص بمشروعك هنا */
const SUPABASE_KEY="const SUPABASE_KEY="sb_publishable_dTg1TjFIepJqVTycKHe42A_DW0ZwNT_";";

const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

async function login(){

 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const message=document.getElementById("message");

 if(!email||!password){
  message.textContent="أدخل البريد وكلمة المرور";
  return;
 }

 message.textContent="جاري تسجيل الدخول...";

 const {data,error}=await db.auth.signInWithPassword({
  email,
  password
 });

 if(error){
  message.textContent="تعذر تسجيل الدخول. تحقق من البيانات.";
  return;
 }

 const {data:admin,error:adminError}=await db
 .from("admin_users")
 .select("user_id")
 .eq("user_id",data.user.id)
 .maybeSingle();

 if(adminError||!admin){
  await db.auth.signOut();
  message.textContent="هذا الحساب ليس لديه صلاحية المدير.";
  return;
 }

 document.getElementById("loginBox").hidden=true;
 document.getElementById("dashboard").hidden=false;

 await loadOrders();
}

function addText(parent,label,value){

 const p=document.createElement("p");
 p.textContent=label+(value??"غير متوفر");
 parent.appendChild(p);

}

function showProducts(parent,products){

 const section=document.createElement("div");
 section.className="details";

 const heading=document.createElement("h4");
 heading.textContent="تفاصيل المنتجات";
 section.appendChild(heading);

 let items=products;

 if(typeof items==="string"){
  try{
   items=JSON.parse(items);
  }catch(e){
   items=[];
  }
 }

 if(!Array.isArray(items)||items.length===0){

  addText(section,"المنتجات: ","لا توجد تفاصيل");

 }else{

  items.forEach(item=>{

   const product=document.createElement("div");
   product.className="product";

   if(typeof item==="string"){

    product.textContent=item;

   }else{

    const name=item.name||item.product_name||item.title||"منتج";
    const quantity=item.quantity??item.qty??1;
    const price=item.price??0;

    addText(product,"المنتج: ",name);
    addText(product,"الكمية: ",quantity);
    addText(product,"السعر: ",price+" دينار");

   }

   section.appendChild(product);

  });

 }

 parent.appendChild(section);

}

async function changeStatus(orderId,newStatus){

 const status=document.getElementById("status");
 status.textContent="جاري تحديث حالة الطلب...";

 const {error}=await db
  .from("orders")
  .update({status:newStatus})
  .eq("id",orderId);

 if(error){
  status.textContent="تعذر تحديث الحالة: "+error.message;
  return;
 }

 status.textContent="تم تحديث حالة الطلب.";

 await loadOrders();

}

async function loadOrders(){

 const status=document.getElementById("status");
 const box=document.getElementById("orders");

 status.textContent="جاري تحميل الطلبات...";
 box.replaceChildren();

 const {data,error}=await db
  .from("orders")
  .select("id,customer_name,total,status,created_at,customer_notes,products")
  .order("created_at",{ascending:false});

 if(error){
  status.textContent="تعذر تحميل الطلبات: "+error.message;
  return;
 }

 if(!data||data.length===0){
  status.textContent="لا توجد طلبات حالياً.";
  return;
 }

 status.textContent="عدد الطلبات: "+data.length;

 data.forEach(order=>{

  const card=document.createElement("div");
  card.className="order";

  const title=document.createElement("h3");
  title.textContent="طلب رقم: "+order.id;
  card.appendChild(title);

  addText(card,"الزبون: ",order.customer_name);
  addText(card,"المجموع: ",order.total+" دينار");
  addText(card,"الحالة: ",order.status||"جديد");

  showProducts(card,order.products);

  const notes=document.createElement("div");
  notes.className="details";

  const notesTitle=document.createElement("h4");
  notesTitle.textContent="ملاحظات الزبون";
  notes.appendChild(notesTitle);

  addText(notes,"الملاحظات: ",order.customer_notes||"لا توجد ملاحظات");
  card.appendChild(notes);

  const actions=[
   {label:"قبول الطلب",value:"تم قبول الطلب",className:""},
   {label:"قيد التوصيل",value:"قيد التوصيل",className:"delivery"},
   {label:"تم التسليم",value:"تم التسليم",className:"done"},
   {label:"إلغاء الطلب",value:"تم الإلغاء",className:"cancel"}
  ];

  actions.forEach(action=>{

   const button=document.createElement("button");
   button.textContent=action.label;

   if(action.className){
    button.className=action.className;
   }

   button.addEventListener("click",()=>{
    changeStatus(order.id,action.value);
   });

   card.appendChild(button);

  });

  box.appendChild(card);

 });

}

async function logout(){

 await db.auth.signOut();

 document.getElementById("dashboard").hidden=true;
 document.getElementById("loginBox").hidden=false;
 document.getElementById("password").value="";
 document.getElementById("message").textContent="تم تسجيل الخروج.";

}
</script>

</body>
</html>
