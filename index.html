
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>طلبات المدينة</title>

  <meta name="description" content="طلبات المدينة - كل احتياجاتك توصلك لحد باب البيت">
  <meta name="theme-color" content="#102a43">

  <link rel="manifest" href="./manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f8;
      color: #222;
    }

    header {
      background: #102a43;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 27px;
    }

    header p {
      margin: 0;
      font-size: 15px;
    }

    .container {
      padding: 18px;
      max-width: 650px;
      margin: auto;
    }

    .welcome {
      background: white;
      padding: 20px;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 2px 8px #00000010;
      margin-bottom: 18px;
    }

    .welcome h2 {
      color: #102a43;
      margin-top: 0;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .item {
      background: white;
      border-radius: 14px;
      padding: 20px 10px;
      text-align: center;
      text-decoration: none;
      color: #102a43;
      box-shadow: 0 2px 8px #00000010;
      font-size: 17px;
      font-weight: bold;
    }

    .item span {
      display: block;
      font-size: 35px;
      margin-bottom: 10px;
    }

    .install {
      display: none;
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      margin-top: 18px;
      background: #16834a;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 22px;
      color: #666;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <h1>طلبات المدينة</h1>
    <p>كل احتياجاتك توصلك لحد باب البيت</p>
  </header>

  <main class="container">

    <section class="welcome">
      <h2>أهلاً وسهلاً بك</h2>
      <p>اطلب احتياجاتك بسهولة من متاجر مدينتك.</p>
    </section>

    <section class="menu">

      <a class="item" href="./stores.html">
        <span>🏪</span>
        المتاجر
      </a>

      <a class="item" href="./products.html?storeId=1&store=مطعم%20تجريبي">
        <span>🍔</span>
        المنتجات
      </a>

      <a class="item" href="./admin.html">
        <span>⚙️</span>
        لوحة المدير
      </a>

      <a class="item" href="./stores.html">
        <span>🛵</span>
        اطلب الآن
      </a>

    </section>

    <button id="installButton" class="install">
      تثبيت تطبيق طلبات المدينة
    </button>

  </main>

  <footer>
    جميع الحقوق محفوظة © طلبات المدينة
  </footer>

  <script>
    // تسجيل Service Worker
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js")
          .catch(function (error) {
            console.log("Service Worker:", error);
          });
      });
    }

    // زر تثبيت التطبيق إذا كان المتصفح يدعم ذلك
    let installPrompt = null;
    const installButton = document.getElementById("installButton");

    window.addEventListener("beforeinstallprompt", function (event) {
      event.preventDefault();
      installPrompt = event;
      installButton.style.display = "block";
    });

    installButton.addEventListener("click", async function () {
      if (!installPrompt) return;

      installPrompt.prompt();
      await installPrompt.userChoice;
      installPrompt = null;
      installButton.style.display = "none";
    });

    window.addEventListener("appinstalled", function () {
      installButton.style.display = "none";
    });
  </script>

</body>
</html>
