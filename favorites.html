
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المفضلة - طلبات المدينة</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f3f5f8;color:#222;padding-bottom:30px}
header{background:#5145df;color:white;text-align:center;padding:20px}
main{max-width:650px;margin:auto;padding:15px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px}
.tab{padding:13px;border:0;border-radius:10px;background:#ddd;font-size:16px}
.tab.active{background:#5145df;color:white}
.item{background:white;border-radius:13px;padding:15px;margin:10px 0;display:flex;align-items:center;gap:12px}
.item-icon{font-size:35px}
.item-info{flex:1;min-width:0}
.item-info h3{margin:0 0 7px}
.item-info p{margin:0;color:#777;font-size:13px}
.remove{background:#df174a;color:white;border:0;border-radius:8px;padding:10px}
.empty{text-align:center;color:#777;background:white;padding:25px;border-radius:12px}
.back{display:block;text-align:center;margin:20px;color:#5145df;text-decoration:none}
.add-box{background:white;padding:15px;border-radius:12px;margin-bottom:15px}
input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin:7px 0;font-size:15px}
.add{width:100%;padding:13px;background:#16834a;color:white;border:0;border-radius:9px;font-size:16px}
#message{font-size:14px;line-height:1.7}
</style>
</head>

<body>

<header>
<h2>♥ المفضلة</h2>
<p>متاجرك ومنتجاتك المفضلة</p>
</header>

<main>

<div id="accountStatus" class="empty">جارٍ التحقق من الحساب...</div>

<div class="add-box" id="addBox" hidden>
<h3>إضافة إلى المفضلة</h3>

<select id="type">
<option value="store">متجر</option>
<option value="product">منتج</option>
</select>

<input id="itemName" placeholder="اسم المتجر أو المنتج">
<input id="itemDescription" placeholder="وصف مختصر (اختياري)">

<button class="add" id="addButton" onclick="addFavorite()">
♥ إضافة للمفضلة
</button>

<p id="message"></p>
</div>

<div class="tabs">
<button class="tab active" id="storesTab" onclick="showType('store')">المتاجر</button>
<button class="tab" id="productsTab" onclick="showType('product')">المنتجات</button>
</div>

<div id="favoritesList"></div>

<a class="back" href="./index.html">العودة إلى الرئيسية</a>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL='https://iombzxymujzetguqdhkq.supabase.co';

const SUPABASE_KEY='sb_publishable_dTg1TjFIepJqVTycKHe42A_DW0ZwNT_';

const db=window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser=null;
let currentType='store';
let favorites=[];

function message(text){
  document.getElementById('message').textContent=text;
}

async function start(){
  const status=document.getElementById('accountStatus');

  try{
    const {data,error}=await db.auth.getUser();

    if(error) throw error;

    currentUser=data.user;

    if(!currentUser){
      status.innerHTML=
        'يرجى تسجيل الدخول حتى تستخدم المفضلة.<br><br>'+
        '<a href="./account.html">تسجيل الدخول إلى حسابك</a>';
      document.getElementById('addBox').hidden=true;
      document.getElementById('favoritesList').innerHTML='';
      return;
    }

    status.textContent='تم تسجيل الدخول بنجاح ✓';
    document.getElementById('addBox').hidden=false;

    await migrateOldFavorites();
    await loadFavorites();

  }catch(error){
    status.textContent='حدث خطأ في الاتصال: '+error.message;
  }
}

async function migrateOldFavorites(){
  const key='talabat_madina_favorites';

  try{
    const oldItems=JSON.parse(localStorage.getItem(key)||'[]');

    if(!Array.isArray(oldItems)||oldItems.length===0)return;

    const rows=oldItems
      .filter(item=>item.name&&item.type)
      .map(item=>({
        user_id:currentUser.id,
        item_type:item.type,
        item_id:String(item.id),
        item_name:item.name,
        item_description:item.description||''
      }));

    if(rows.length===0)return;

    const {error}=await db
      .from('favorites')
      .upsert(rows,{
        onConflict:'user_id,item_type,item_id',
        ignoreDuplicates:true
      });

    if(error)throw error;

    localStorage.removeItem(key);

  }catch(error){
    console.error('Migration error:',error);
  }
}

async function loadFavorites(){
  const list=document.getElementById('favoritesList');
  list.innerHTML='<div class="empty">جارٍ تحميل المفضلة...</div>';

  const {data,error}=await db
    .from('favorites')
    .select('*')
    .eq('user_id',currentUser.id)
    .order('created_at',{ascending:false});

  if(error){
    list.textContent='تعذر تحميل المفضلة: '+error.message;
    return;
  }

  favorites=data||[];
  showType(currentType);
}

async function addFavorite(){
  const type=document.getElementById('type').value;
  const name=document.getElementById('itemName').value.trim();
  const description=document.getElementById('itemDescription').value.trim();
  const button=document.getElementById('addButton');

  if(!name){
    message('اكتب اسم المتجر أو المنتج أولاً');
    return;
  }

  button.disabled=true;
  message('جارٍ الحفظ...');

  const itemId='manual-'+Date.now();

  const {error}=await db
    .from('favorites')
    .insert({
      user_id:currentUser.id,
      item_type:type,
      item_id:itemId,
      item_name:name,
      item_description:description
    });

  button.disabled=false;

  if(error){
    message('لم تتم الإضافة: '+error.message);
    return;
  }

  document.getElementById('itemName').value='';
  document.getElementById('itemDescription').value='';

  message('تمت الإضافة بنجاح ✓');

  await loadFavorites();
  showType(type);
}

function showType(type){
  currentType=type;

  document.getElementById('storesTab')
    .classList.toggle('active',type==='store');

  document.getElementById('productsTab')
    .classList.toggle('active',type==='product');

  const list=document.getElementById('favoritesList');

  const items=favorites.filter(item=>item.item_type===type);

  if(items.length===0){
    list.innerHTML='<div class="empty">لا توجد عناصر في المفضلة حالياً ♥</div>';
    return;
  }

  list.innerHTML='';

  items.forEach(item=>{
    const card=document.createElement('div');
    card.className='item';

    const icon=document.createElement('div');
    icon.className='item-icon';
    icon.textContent=type==='store'?'🏪':'🛍️';

    const info=document.createElement('div');
    info.className='item-info';

    const title=document.createElement('h3');
    title.textContent=item.item_name;

    const description=document.createElement('p');
    description.textContent=item.item_description||'ضمن المفضلة';

    info.append(title,description);

    const remove=document.createElement('button');
    remove.className='remove';
    remove.textContent='حذف';
    remove.onclick=()=>deleteFavorite(item.id);

    card.append(icon,info,remove);
    list.appendChild(card);
  });
}

async function deleteFavorite(id){
  if(!confirm('هل تريد حذف هذا العنصر من المفضلة؟'))return;

  const {error}=await db
    .from('favorites')
    .delete()
    .eq('id',id)
    .eq('user_id',currentUser.id);

  if(error){
    message('تعذر الحذف: '+error.message);
    return;
  }

  message('تم الحذف بنجاح ✓');
  await loadFavorites();
}

start();
</script>

</body>
</html>
