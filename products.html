<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منتجات طلبات المدينة</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f3f5f8;color:#222}
header{background:#102a43;color:white;text-align:center;padding:18px}
.container{padding:15px;max-width:900px;margin:auto}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.product,.cart,.checkout{background:white;padding:15px;border-radius:12px;margin-bottom:15px;box-shadow:0 2px 8px #00000012}
.product{text-align:center}
.product img{width:100%;height:130px;object-fit:contain}
.price,.total{color:#16834a;font-weight:bold}
button{border:0;padding:12px;border-radius:8px;color:white;background:#16834a;font-size:15px;cursor:pointer}
.back{background:#102a43}
.delete{background:#c0392b}
.small-btn{padding:7px 12px}
input,textarea{width:100%;padding:13px;margin:7px 0 14px;border:1px solid #ccc;border-radius:8px;font-size:16px;font-family:Arial}
textarea{min-height:80px}
.checkout button{width:100%;margin-top:10px}
.notice,.message{background:white;padding:14px;border-radius:10px;line-height:1.8;margin:12px 0}
.message{text-align:center;grid-column:1/-1}
.cart-row{padding:12px 0;border-bottom:1px solid #ddd}
.quantity-controls{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.quantity{font-weight:bold}
.final-total{font-size:19px;font-weight:bold;background:#d5efdd;padding:12px;border-radius:8px}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
<header>
<h2>طلبات المدينة 🛍️</h2>
<p>تسوّق واطلب بسهولة</p>
</header>

<div class="container">

<button class="back" onclick="history.back()">رجوع</button>

<h2 id="storeName">المتجر</h2>
<h3>منتجات المتجر</h3>
<div class="products" id="products">
<div class="message">جاري تحميل المنتجات...</div>
</div>

<div class="cart">
<h2>🛒 سلة المشتريات</h2>
<p id="cartCount">عدد المنتجات: 0</p>
<div id="cartItems">السلة فارغة</div>
<p class="total" id="total">مجموع المنتجات: 0 دينار</p>
</div>

<div class="checkout">
<h2>إتمام الطلب</h2>
<div class="notice">
أجرة التوصيل يحددها المدير بعد مراجعة الطلب.
</div>

<form id="orderForm">
<label>اسم الزبون</label>
<input id="customerName" required>

<label>رقم الهاتف</label>
<input id="customerPhone" type="tel" required>

<label>عنوان التوصيل</label>
<input id="customerAddress" required>

<label>ملاحظات إضافية</label>
<textarea id="customerNotes"></textarea>

<button type="submit">تأكيد الطلب</button>
</form>
</div>

<div id="result"></div>
</div>

<script>
const SUPABASE_URL = "https://iombzxymujzetguqdhkq.supabase.co";
const SUPABASE_KEY = "sb_publishable_dTg1TjFIepJqVTycKHe42A_DW0ZwNT_";
const db = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const params = new URLSearchParams(location.search);
const storeId = params.get("storeId");
const storeName = params.get("store") || "المتجر";

document.getElementById("storeName").textContent = storeName;

let products = [];
let cart = [];

function money(value){
    return Number(value || 0).toLocaleString("en-US")+" دينار";
}

async function loadProducts(){
    const area = document.getElementById("products");

    if(!storeId){
        area.innerHTML = '<div class="message">رقم المتجر غير موجود. ارجع واختر المتجر من القائمة.</div>';
        return;
    }

    try{
        const {data,error} = await db
            .from("products")
            .select("id,name,price,image,store_id")
            .eq("store_id",storeId)
            .order("created_at",{ascending:false});

        if(error) throw error;

        products = data || [];
        showProducts();

    }catch(error){
        console.error(error);
        area.innerHTML = '<div class="message">تعذر تحميل المنتجات. تحقق من اتصال قاعدة البيانات والصلاحيات.</div>';
    }
}

function showProducts(){
    const area = document.getElementById("products");
    area.innerHTML = "";

    if(products.length === 0){
        area.innerHTML = '<div class="message">لا توجد منتجات مضافة لهذا المتجر حالياً.</div>';
        return;
    }

    products.forEach((product,index)=>{
        const card = document.createElement("div");
        card.className = "product";

        if(product.image){
            const img = document.createElement("img");
            img.src = product.image;
            img.alt = product.name;
            img.onerror = ()=>{img.style.display="none";};
            card.appendChild(img);
        }

        const name = document.createElement("h3");
        name.textContent = product.name;

        const price = document.createElement("p");
        price.className = "price";
        price.textContent = money(product.price);

        const button = document.createElement("button");
        button.textContent = "أضف إلى السلة";
        button.onclick = ()=>addToCart(index);

        card.append(name,price,button);
        area.appendChild(card);
    });
}

function addToCart(index){
    const product = products[index];
    const existing = cart.find(item=>item.id===product.id);

    if(existing) existing.quantity++;
    else cart.push({...product,quantity:1});

    showCart();
}

function changeQuantity(index,amount){
    cart[index].quantity += amount;
    if(cart[index].quantity <= 0) cart.splice(index,1);
    showCart();
}

function showCart(){
    const area = document.getElementById("cartItems");
    area.innerHTML = "";
    let count = 0;

    cart.forEach((item,index)=>{
        count += item.quantity;

        const row = document.createElement("div");
        row.className = "cart-row";

        const name = document.createElement("strong");
        name.textContent = item.name;

        const price = document.createElement("p");
        price.textContent = money(item.price)+" للقطعة";

        const subtotal = document.createElement("p");
        subtotal.className = "price";
        subtotal.textContent = "المجموع: "+money(item.price*item.quantity);

        const controls = document.createElement("div");
        controls.className = "quantity-controls";

        const minus = document.createElement("button");
        minus.className = "small-btn back";
        minus.textContent = "-";
        minus.onclick = ()=>changeQuantity(index,-1);

        const quantity = document.createElement("span");
        quantity.className = "quantity";
        quantity.textContent = item.quantity;

        const plus = document.createElement("button");
        plus.className = "small-btn";
        plus.textContent = "+";
        plus.onclick = ()=>changeQuantity(index,1);

        controls.append(minus,quantity,plus);
        row.append(name,price,subtotal,controls);
        area.appendChild(row);
    });

    if(cart.length===0) area.textContent="السلة فارغة";

    document.getElementById("cartCount").textContent="عدد المنتجات: "+count;
    document.getElementById("total").textContent="مجموع المنتجات: "+money(total());
}

function total(){
    return cart.reduce((sum,item)=>sum+Number(item.price)*item.quantity,0);
}

/* إرسال الطلب إلى قاعدة البيانات */
document.getElementById("orderForm").addEventListener("submit",async event=>{
    event.preventDefault();

    if(cart.length===0){
        alert("أضف منتجاً واحداً على الأقل إلى السلة");
        return;
    }

    const button = event.submitter;
    button.disabled = true;
    button.textContent = "جاري إرسال الطلب...";

    const order = {
        customer_name:document.getElementById("customerName").value.trim(),
        customer_phone:document.getElementById("customerPhone").value.trim(),
        customer_address:document.getElementById("customerAddress").value.trim(),
        customer_notes:document.getElementById("customerNotes").value.trim(),
        store_id:Number(storeId),
        products:cart.map(item=>({
            id:item.id,
            name:item.name,
            price:Number(item.price),
            quantity:item.quantity
        })),
        total:total(),
        delivery_fee:null,
        status:"بانتظار مراجعة المدير"
    };

    try{
        const {data,error} = await db
            .from("orders")
            .insert(order)
            .select("id")
            .single();

        if(error) throw error;

        document.getElementById("result").innerHTML =
            '<div class="message">تم إرسال الطلب بنجاح. رقم الطلب: '+data.id+'</div>';

        cart=[];
        showCart();
        document.getElementById("orderForm").reset();

    }catch(error){
        console.error(error);
        alert("تعذر إرسال الطلب. قد تحتاج قاعدة البيانات إلى إعداد صلاحية آمنة لإرسال طلبات الزبائن.");
    }finally{
        button.disabled=false;
        button.textContent="تأكيد الطلب";
    }
});

showCart();
loadProducts();
</script>
</body>
</html>
