
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حساب الموصّل - طلبات المدينة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f3f5f8;color:#222}
header{background:#102a43;color:white;text-align:center;padding:18px}
.container{max-width:650px;margin:auto;padding:15px}
.card{background:white;padding:16px;margin:12px 0;border-radius:12px;box-shadow:0 2px 8px #0001}
input,button{width:100%;padding:13px;margin:7px 0;border-radius:8px;font-size:16px}
input{border:1px solid #ccc}
button{border:0;background:#16834a;color:white;cursor:pointer}
button:disabled{opacity:.5}
button.dark{background:#102a43}
button.red{background:#c0392b}
button.orange{background:#d97706}
.order-title{font-weight:bold;color:#102a43;font-size:18px}
.info{line-height:2;overflow-wrap:anywhere}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions a{display:block;text-align:center;padding:12px;border-radius:8px;color:white;text-decoration:none;background:#16834a}
.actions a.blue{background:#1769aa}
.actions a.orange{background:#d97706}
.status-buttons{display:grid;gap:7px;margin-top:12px}
.status-buttons button{margin:0}
.status-current{background:#eef5f0;padding:10px;border-radius:8px;margin-top:10px}
.hidden{display:none}
#message{padding:10px;color:#c0392b;text-align:center;overflow-wrap:anywhere}
.section-title{color:#102a43;margin:22px 4px 8px}
.available-card{border-right:5px solid #16834a}
.small{color:#666;font-size:14px}
#notificationBanner{
display:none;
background:#fff7df;
border-right:5px solid #d97706;
padding:15px;
border-radius:10px;
margin:12px 0;
line-height:1.8;
}
#notificationBanner.show{display:block}
#notificationBanner button{background:#d97706}
#notificationText{font-weight:bold;margin:8px 0}
</style>
</head>

<body>

<header>
<h2>🚚 طلبات المدينة</h2>
<div>حساب الموصّل</div>
</header>

<div class="container">

<div class="card" id="loginBox">
<h3>تسجيل دخول الموصّل</h3>
<input id="phone" type="tel" placeholder="رقم الهاتف">
<input id="password" type="password" placeholder="كلمة المرور">
<button id="loginButton" onclick="login()">دخول</button>
<div id="message"></div>
</div>

<div id="accountBox" class="hidden">

<div class="card">
<h3 id="driverName">أهلاً بك</h3>
<p>تابع الطلبات المتاحة والطلبات المسندة إليك.</p>

<button class="dark" onclick="loadOrders()">🔄 تحديث الطلبات</button>

<button class="orange" id="notificationButton"
onclick="enableNotifications()">
🔔 تفعيل إشعارات الطلبات
</button>

<p class="small" id="notificationStatus">
التنبيهات الصوتية والداخلية تعمل أثناء فتح الحساب.
</p>

<button class="red" onclick="logout()">تسجيل الخروج</button>
</div>

<div id="notificationBanner">
<b>🔔 وصل طلب جديد!</b>
<div id="notificationText"></div>
<button onclick="loadOrders()">عرض الطلبات</button>
<button class="dark" onclick="hideNotification()">إخفاء التنبيه</button>
</div>

<h3 class="section-title">📦 الطلبات المتاحة</h3>
<p class="small">تظهر هنا الطلبات التي وافق عليها المدير ولم يستلمها أي موصّل.</p>
<div id="availableOrders"></div>

<h3 class="section-title">🚚 الطلبات المسندة إليك</h3>
<div id="orders"></div>

</div>
</div>

<script>
const SUPABASE_URL =
"https://iombzxymujzetguqdhkq.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_dTg1TjFIepJqVTycKHe42A_DW0ZwNT_";

const message = document.getElementById("message");

let db = null;
let currentDriver = null;
let notificationTimer = null;
let knownAvailableOrderIds = new Set();
let hasNotificationBaseline = false;
let checkingNotifications = false;
let audioContext = null;

function showMessage(text){
  message.textContent = text;
}

function normalizePhone(value){
  let p = String(value || "").replace(/\D/g,"");
  if(p.startsWith("00")) p = p.slice(2);
  if(p.startsWith("07")) p = "964" + p.slice(1);
  else if(p.startsWith("7")) p = "964" + p;
  return p;
}

function escapeHTML(value){
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  })[ch]);
}

function displayValue(value){
  if(value == null || value === "") return "غير متوفر";
  if(typeof value === "object") return JSON.stringify(value);
  return String(value);
}

function initialize(){
  const key = SUPABASE_ANON_KEY.trim();

  if(!key || /[^\x00-\x7F]/.test(key)){
    showMessage("مفتاح الاتصال غير صحيح");
    return false;
  }

  if(!window.supabase){
    showMessage("تعذر تحميل مكتبة الاتصال");
    return false;
  }

  db = window.supabase.createClient(
    SUPABASE_URL,
    key,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:false,
        storageKey:"talabat-driver-auth"
      }
    }
  );

  return true;
}

/* تهيئة الصوت بعد تفاعل المستخدم */
function unlockAudio(){
  try{
    const AudioContextClass =
      window.AudioContext || window.webkitAudioContext;

    if(!AudioContextClass) return;

    if(!audioContext){
      audioContext = new AudioContextClass();
    }

    if(audioContext.state === "suspended"){
      audioContext.resume();
    }
  }catch(error){
    console.log("الصوت غير متاح:",error.message);
  }
}

/* تشغيل صوت تنبيه قصير */
function playAlertSound(){
  try{
    if(!audioContext) return;

    if(audioContext.state === "suspended"){
      audioContext.resume();
    }

    const now = audioContext.currentTime;

    [0,0.25].forEach((delay,index)=>{
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.type = "sine";
      oscillator.frequency.value = index === 0 ? 880 : 1100;

      gain.gain.setValueAtTime(0.0001,now + delay);
      gain.gain.exponentialRampToValueAtTime(
        0.18,now + delay + 0.02
      );
      gain.gain.exponentialRampToValueAtTime(
        0.0001,now + delay + 0.18
      );

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      oscillator.start(now + delay);
      oscillator.stop(now + delay + 0.2);
    });

  }catch(error){
    console.log("تعذر تشغيل صوت التنبيه");
  }
}

/* تفعيل إشعارات المتصفح */
async function enableNotifications(){
  unlockAudio();

  if(!("Notification" in window)){
    document.getElementById("notificationStatus").textContent =
      "المتصفح لا يدعم إشعارات النظام. التنبيهات داخل الصفحة والصوت تبقى متاحة.";
    playAlertSound();
    return;
  }

  try{
    const permission = await Notification.requestPermission();

    if(permission === "granted"){
      document.getElementById("notificationStatus").textContent =
        "إشعارات المتصفح مفعّلة. التنبيهات تعمل أثناء فتح الصفحة.";

      document.getElementById("notificationButton").textContent =
        "✓ الإشعارات مفعّلة";

      new Notification("طلبات المدينة",{
        body:"تم تفعيل إشعارات الطلبات الجديدة."
      });

      playAlertSound();

    }else{
      document.getElementById("notificationStatus").textContent =
        "لم يتم السماح بإشعارات المتصفح. التنبيهات داخل الصفحة والصوت تعمل عند فتح الحساب.";
    }

  }catch(error){
    document.getElementById("notificationStatus").textContent =
      "تعذر تفعيل إشعارات المتصفح. التنبيهات داخل الصفحة تبقى متاحة.";
  }
}

/* إخفاء التنبيه */
function hideNotification(){
  document.getElementById("notificationBanner")
    .classList.remove("show");
}

/* إظهار تنبيه الطلب الجديد */
function showNewOrderNotification(order){
  const orderId = String(order.order_id);

  document.getElementById("notificationBanner").classList.add("show");

  document.getElementById("notificationText").textContent =
    "يوجد طلب جديد رقم " + orderId +
    " بمبلغ " + (order.order_total || "غير محدد") + " د.ع";

  playAlertSound();

  if(
    "Notification" in window &&
    Notification.permission === "granted"
  ){
    try{
      new Notification("طلب جديد - طلبات المدينة",{
        body:
          "طلب رقم " + orderId +
          " - المبلغ: " + (order.order_total || "غير محدد") + " د.ع"
      });
    }catch(error){
      console.log("تعذر عرض إشعار المتصفح");
    }
  }
}

/* فحص الطلبات الجديدة */
async function checkNewAvailableOrders(){
  if(!currentDriver || !db || checkingNotifications) return;

  checkingNotifications = true;

  try{
    const {data,error} = await db.rpc(
      "driver_available_orders"
    );

    if(error){
      console.log("خطأ فحص الطلبات:",error.message);
      return;
    }

    const orders = data || [];

    const currentIds = new Set(
      orders.map(order => String(order.order_id))
    );

    /* تسجيل أول نتيجة حتى لو كانت فارغة */
    if(!hasNotificationBaseline){
      knownAvailableOrderIds = currentIds;
      hasNotificationBaseline = true;
      return;
    }

    const newOrders = orders.filter(order =>
      !knownAvailableOrderIds.has(String(order.order_id))
    );

    knownAvailableOrderIds = currentIds;

    if(newOrders.length > 0){
      showNewOrderNotification(newOrders[0]);
      await loadAvailableOrders(false);
    }

  }catch(error){
    console.log("خطأ فحص الطلبات:",error.message);
  }finally{
    checkingNotifications = false;
  }
}

/* تشغيل الفحص كل 20 ثانية */
function startNotificationChecking(){
  stopNotificationChecking();

  notificationTimer = setInterval(
    checkNewAvailableOrders,
    20000
  );
}

/* إيقاف الفحص */
function stopNotificationChecking(){
  if(notificationTimer){
    clearInterval(notificationTimer);
    notificationTimer = null;
  }
}

/* تسجيل الدخول */
async function login(){
  unlockAudio();

  if(!db && !initialize()) return;

  const phone = normalizePhone(
    document.getElementById("phone").value
  );

  const password =
    document.getElementById("password").value;

  if(!phone || !password){
    showMessage("أدخل رقم الهاتف وكلمة المرور");
    return;
  }

  const button = document.getElementById("loginButton");
  button.disabled = true;
  showMessage("جارٍ تسجيل الدخول...");

  try{
    const internalEmail =
      phone + "@drivers.talabat-almadina.invalid";

    const {data,error} = await db.auth.signInWithPassword({
      email:internalEmail,
      password:password
    });

    if(error){
      showMessage("تعذر تسجيل الدخول: " + error.message);
      return;
    }

    const {data:profile,error:profileError} = await db
      .from("driver_profiles")
      .select("id,full_name,phone")
      .eq("id",data.user.id)
      .single();

    if(profileError || !profile){
      await db.auth.signOut();
      showMessage("لم يتم العثور على ملف الموصّل");
      return;
    }

    currentDriver = profile;

    document.getElementById("loginBox").classList.add("hidden");
    document.getElementById("accountBox").classList.remove("hidden");

    document.getElementById("driverName").textContent =
      "أهلاً " + profile.full_name;

    knownAvailableOrderIds = new Set();
    hasNotificationBaseline = false;

    await loadOrders();

    startNotificationChecking();

    hideNotification();

  }catch(error){
    showMessage("خطأ اتصال: " + error.message);
  }finally{
    button.disabled = false;
  }
}

/* تحميل الطلبات المتاحة */
async function loadAvailableOrders(updateKnownIds = true){
  const box = document.getElementById("availableOrders");

  box.innerHTML =
    "<div class='card'>جارٍ تحميل الطلبات المتاحة...</div>";

  try{
    const {data,error} = await db.rpc(
      "driver_available_orders"
    );

    if(error){
      box.innerHTML =
        "<div class='card'>تعذر تحميل الطلبات المتاحة: " +
        escapeHTML(error.message) + "</div>";
      return;
    }

    const available = data || [];

    if(updateKnownIds){
      knownAvailableOrderIds = new Set(
        available.map(order => String(order.order_id))
      );
      hasNotificationBaseline = true;
    }

    if(available.length === 0){
      box.innerHTML =
        "<div class='card'>لا توجد طلبات متاحة حالياً.</div>";
      return;
    }

    box.innerHTML = available.map(order => {
      const orderId = String(order.order_id || "")
        .replace(/\D/g,"");

      return `
        <div class="card available-card">
          <div class="order-title">
            طلب رقم: ${escapeHTML(orderId)}
          </div>

          <div class="info">
            <b>المبلغ:</b>
            ${escapeHTML(order.order_total)} د.ع<br>

            <b>الحالة:</b>
            ${escapeHTML(order.order_status)}<br>

            <b>التاريخ:</b>
            ${escapeHTML(
              order.order_created_at
                ? new Date(order.order_created_at)
                    .toLocaleString("ar-IQ")
                : "غير متوفر"
            )}
          </div>

          <p class="small">
            بيانات الزبون تظهر بعد قبول الطلب.
          </p>

          <button
            type="button"
            onclick="claimOrder('${orderId}',this)"
          >قبول الطلب</button>
        </div>
      `;
    }).join("");

  }catch(error){
    box.innerHTML =
      "<div class='card'>خطأ: " +
      escapeHTML(error.message) + "</div>";
  }
}

/* قبول الطلب */
async function claimOrder(orderId,button){
  if(!currentDriver) return;

  if(!confirm("هل تريد استلام الطلب رقم " + orderId + "؟")){
    return;
  }

  button.disabled = true;
  button.textContent = "جارٍ قبول الطلب...";

  try{
    const {data,error} = await db.rpc(
      "driver_claim_order",
      {p_order_id:orderId}
    );

    if(error){
      alert("تعذر قبول الطلب: " + error.message);
      button.disabled = false;
      button.textContent = "قبول الطلب";
      return;
    }

    if(data !== true){
      alert("هذا الطلب استلمه موصّل آخر أو لم يعد متاحاً.");
      await loadOrders();
      return;
    }

    alert("تم قبول الطلب بنجاح.");
    await loadOrders();

  }catch(error){
    alert("خطأ: " + error.message);
    button.disabled = false;
    button.textContent = "قبول الطلب";
  }
}

/* تحديث حالة الطلب */
async function updateOrderStatus(orderId,status,button){
  if(!currentDriver) return;

  const allowedStatuses = [
    "تم استلام الطلب",
    "بالطريق إلى الزبون",
    "تم توصيل الطلب",
    "تعذّر توصيل الطلب"
  ];

  if(!allowedStatuses.includes(status)){
    alert("حالة الطلب غير مسموحة");
    return;
  }

  if(!confirm("هل تريد تغيير حالة الطلب إلى: " + status + "؟")){
    return;
  }

  button.disabled = true;
  button.textContent = "جارٍ التحديث...";

  try{
    const {data,error} = await db
      .from("orders")
      .update({status:status})
      .eq("id",orderId)
      .eq("driver_id",currentDriver.id)
      .select("id");

    if(error){
      alert("تعذر تحديث الحالة: " + error.message);
      button.disabled = false;
      button.textContent = status;
      return;
    }

    if(!data || data.length === 0){
      alert("لم يتم تحديث الطلب. تأكد من تعيينه لحسابك.");
      button.disabled = false;
      button.textContent = status;
      return;
    }

    alert("تم تحديث حالة الطلب بنجاح");
    await loadOrders();

  }catch(error){
    alert("خطأ: " + error.message);
    button.disabled = false;
    button.textContent = status;
  }
}

/* تحميل الطلبات المسندة والمتاحة */
async function loadOrders(){
  if(!currentDriver) return;

  const box = document.getElementById("orders");

  box.innerHTML =
    "<div class='card'>جارٍ تحميل الطلبات المسندة...</div>";

  await loadAvailableOrders(true);

  try{
    const {data,error} = await db
      .from("orders")
      .select("*")
      .eq("driver_id",currentDriver.id)
      .order("created_at",{ascending:false});

    if(error){
      box.innerHTML =
        "<div class='card'>تعذر تحميل الطلبات: " +
        escapeHTML(error.message) + "</div>";
      return;
    }

    if(!data || data.length === 0){
      box.innerHTML =
        "<div class='card'>لا توجد طلبات مسندة إليك حالياً.</div>";
      return;
    }

    box.innerHTML = data.map(order => {
      const phone = order.customer_phone || "";
      const name = order.customer_name || "زبون";
      const address = order.customer_address || "لم يحدد العنوان";
      const lat = order.customer_latitude;
      const lng = order.customer_longitude;

      const waze = lat != null && lng != null
        ? "https://waze.com/ul?ll=" +
          encodeURIComponent(lat + "," + lng) +
          "&navigate=yes"
        : "";

      const whatsapp = phone
        ? "https://wa.me/" + normalizePhone(phone)
        : "";

      const orderId = String(order.id).replace(/\D/g,"");

      const statuses = [
        "تم استلام الطلب",
        "بالطريق إلى الزبون",
        "تم توصيل الطلب",
        "تعذّر توصيل الطلب"
      ];

      const statusButtons = statuses.map(status => `
        <button
          type="button"
          class="${status === 'تعذّر توصيل الطلب' ? 'red' : ''}"
          onclick="updateOrderStatus('${orderId}','${status}',this)"
          ${order.status === status ? "disabled" : ""}
        >${order.status === status ? "✓ " : ""}${status}</button>
      `).join("");

      return `
        <div class="card">
          <div class="order-title">
            طلب رقم: ${escapeHTML(order.id)}
          </div>

          <div class="info">
            <b>المنتجات:</b>
            ${escapeHTML(displayValue(order.products))}<br>

            <b>اسم الزبون:</b>
            ${escapeHTML(name)}<br>

            <b>رقم الهاتف:</b>
            ${escapeHTML(phone || "غير متوفر")}<br>

            <b>العنوان:</b>
            ${escapeHTML(address)}<br>

            <b>ملاحظات الزبون:</b>
            ${escapeHTML(order.customer_notes || "لا توجد")}<br>

            <b>المبلغ:</b>
            ${escapeHTML(order.total ?? "غير محدد")} د.ع<br>

            <b>أجور التوصيل:</b>
            ${escapeHTML(order.delivery_fee ?? "غير محدد")} د.ع<br>

            <b>التاريخ:</b>
            ${escapeHTML(
              order.created_at
                ? new Date(order.created_at).toLocaleString("ar-IQ")
                : "غير متوفر"
            )}
          </div>

          <div class="status-current">
            <b>حالة الطلب الحالية:</b>
            ${escapeHTML(order.status || "غير محدد")}
          </div>

          <h4>تغيير حالة الطلب</h4>
          <div class="status-buttons">
            ${statusButtons}
          </div>

          <div class="actions">
            ${phone ? `<a href="tel:${encodeURIComponent(phone)}">📞 اتصال</a>` : ""}
            ${whatsapp ? `<a class="blue" href="${whatsapp}" target="_blank" rel="noopener">واتساب</a>` : ""}
            ${waze ? `<a class="orange" href="${waze}" target="_blank" rel="noopener">📍 Waze</a>` : ""}
          </div>
        </div>
      `;
    }).join("");

  }catch(error){
    box.innerHTML =
      "<div class='card'>خطأ: " +
      escapeHTML(error.message) + "</div>";
  }
}

/* تسجيل الخروج */
async function logout(){
  stopNotificationChecking();

  if(db) await db.auth.signOut();

  currentDriver = null;
  knownAvailableOrderIds = new Set();
  hasNotificationBaseline = false;

  document.getElementById("accountBox").classList.add("hidden");
  document.getElementById("loginBox").classList.remove("hidden");

  document.getElementById("orders").innerHTML = "";
  document.getElementById("availableOrders").innerHTML = "";

  hideNotification();

  document.getElementById("password").value = "";

  showMessage("تم تسجيل الخروج");
}

/* عند الرجوع إلى الصفحة نفحص الطلبات فوراً */
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden && currentDriver){
    checkNewAvailableOrders();
  }
});

initialize();
</script>

</body>
</html>
