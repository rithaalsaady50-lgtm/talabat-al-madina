
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حساب الموصّل - طلبات المدينة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f8;font-family:Arial;color:#222}
header{background:#102a43;color:white;padding:20px;text-align:center}
main{max-width:650px;margin:auto;padding:15px}
.box,.order{background:white;padding:17px;border-radius:13px;margin-bottom:15px;box-shadow:0 2px 8px #0001}
input{width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:8px;font-size:16px}
button,.link{display:inline-block;border:0;border-radius:8px;padding:12px;margin:4px 0;background:#16834a;color:white;text-decoration:none;font-size:15px;cursor:pointer}
button{width:100%}
.logout{background:#c0392b}
.contact{background:#16834a}
.whatsapp{background:#159b75}
.waze{background:#1769aa}
h3{margin-top:0;color:#102a43}
.small{color:#666;font-size:13px}
.hidden{display:none}
</style>
</head>
<body>

<header>
<h2>طلبات المدينة 🛵</h2>
<div>بوابة الموصّلين</div>
</header>

<main>
<section class="box" id="loginBox">
<h3>دخول الموصّل</h3>
<input id="phone" type="tel" placeholder="رقم الهاتف">
<input id="password" type="password" placeholder="كلمة المرور">
<button onclick="login()">تسجيل الدخول</button>
<p id="loginMessage"></p>
</section>

<section id="driverArea" class="hidden">
<div class="box">
<h3 id="driverName">حساب الموصّل</h3>
<p>هذه قائمة الطلبات المسندة إلى حسابك.</p>
<button onclick="loadOrders()">تحديث الطلبات</button>
<button class="logout" onclick="logout()">تسجيل الخروج</button>
</div>
<div id="orders"></div>
</section>
</main>

<script>
const SUPABASE_URL = "https://iombzxymujzetguqdhkq.supabase.co";
const SUPABASE_KEY = "sb_publishable_dTg1TjFIepJqVTycKHe42A_DW0ZwNT_";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function normalizePhone(value){
 let p=value.replace(/[^\d+]/g,"");
 if(p.startsWith("00")) p="+"+p.slice(2);
 else if(p.startsWith("07")) p="+964"+p.slice(1);
 else if(p.startsWith("7")) p="+964"+p;
 else if(p.startsWith("964")) p="+"+p;
 return p;
}

async function login(){
 const phone=normalizePhone(document.getElementById("phone").value);
 const password=document.getElementById("password").value;
 const message=document.getElementById("loginMessage");

 if(!phone || !password){
  message.textContent="أدخل رقم الهاتف وكلمة المرور";
  return;
 }

 message.textContent="جارٍ تسجيل الدخول...";

 const {data,error}=await db.auth.signInWithPassword({
  phone:phone,
  password:password
 });

 if(error){
  message.textContent="تعذر تسجيل الدخول: "+error.message;
  return;
 }

 await showDriver();
}

async function showDriver(){
 const {data:{user}}=await db.auth.getUser();

 if(!user) return;

 const {data:profile,error}=await db
  .from("driver_profiles")
  .select("full_name,phone")
  .eq("id",user.id)
  .single();

 if(error){
  alert("تعذر قراءة بيانات الموصّل: "+error.message);
  return;
 }

 document.getElementById("driverName").textContent=
  "أهلاً "+profile.full_name;

 document.getElementById("loginBox").classList.add("hidden");
 document.getElementById("driverArea").classList.remove("hidden");

 await loadOrders();
}

async function loadOrders(){
 const area=document.getElementById("orders");
 area.innerHTML="<div class='box'>جارٍ تحميل الطلبات...</div>";

 const {data:{user}}=await db.auth.getUser();

 if(!user){
  area.innerHTML="<div class='box'>سجّل الدخول أولاً</div>";
  return;
 }

 const {data,error}=await db
  .from("orders")
  .select("*")
  .eq("driver_id",user.id)
  .order("created_at",{ascending:false});

 if(error){
  area.innerHTML="<div class='box'>تعذر تحميل الطلبات: "+
   escapeHTML(error.message)+"</div>";
  return;
 }

 if(!data || data.length===0){
  area.innerHTML="<div class='box'>ما عندك طلبات مسندة حالياً.</div>";
  return;
 }

 area.innerHTML=data.map(order=>{
  const products=Array.isArray(order.products)
   ? order.products.map(p=>{
      if(typeof p==="string") return p;
      return p.name || p.title || "منتج";
     }).join("، ")
   : (typeof order.products==="string"
      ? order.products : "تفاصيل المنتجات");

  const phone=String(order.customer_phone||"").replace(/[^\d+]/g,"");
  const whatsapp=phone.startsWith("0")
   ? "964"+phone.slice(1)
   : phone.replace("+","");
  const hasLocation=order.customer_latitude!=null &&
                    order.customer_longitude!=null;

  const waze=hasLocation
   ? "https://waze.com/ul?ll="+
     encodeURIComponent(order.customer_latitude+","+order.customer_longitude)+
     "&navigate=yes"
   : "";

  return `
   <div class="order">
    <h3>طلب رقم: ${escapeHTML(String(order.id))}</h3>
    <p><b>الزبون:</b> ${escapeHTML(order.customer_name||"غير محدد")}</p>
    <p><b>الهاتف:</b> ${escapeHTML(order.customer_phone||"غير محدد")}</p>
    <p><b>العنوان:</b> ${escapeHTML(order.customer_address||"غير محدد")}</p>
    <p><b>المنتجات:</b> ${escapeHTML(products)}</p>
    <p><b>المجموع:</b> ${escapeHTML(String(order.total??0))} د.ع</p>
    <p><b>أجرة التوصيل:</b> ${escapeHTML(String(order.delivery_fee??0))} د.ع</p>
    <p><b>الحالة:</b> ${escapeHTML(order.status||"غير محددة")}</p>
    ${phone?`<a class="link contact" href="tel:${encodeURIComponent(phone)}">اتصال بالزبون</a>`:""}
    ${whatsapp?`<a class="link whatsapp" target="_blank" rel="noopener" href="https://wa.me/${encodeURIComponent(whatsapp)}">مراسلة واتساب</a>`:""}
    ${waze?`<a class="link waze" target="_blank" rel="noopener" href="${waze}">فتح موقع الزبون في Waze</a>`:"<p class='small'>موقع الزبون غير متوفر</p>"}
    ${order.customer_notes?`<p><b>ملاحظات:</b> ${escapeHTML(order.customer_notes)}</p>`:""}
   </div>
  `;
 }).join("");
}

function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 }[c]));
}

async function logout(){
 await db.auth.signOut();
 location.reload();
}

async function checkSession(){
 const {data:{session}}=await db.auth.getSession();
 if(session) await showDriver();
}

checkSession();
</script>
</body>
</html>
