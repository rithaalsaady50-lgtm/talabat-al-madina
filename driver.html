
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حساب الموصّل - طلبات المدينة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f5f8;font-family:Arial;color:#222}
header{background:#102a43;color:white;padding:20px;text-align:center}
main{max-width:650px;margin:auto;padding:15px}
.box,.order{background:white;padding:17px;border-radius:13px;margin-bottom:15px;box-shadow:0 2px 8px #0001}
input{width:100%;padding:13px;margin:7px 0;border:1px solid #ddd;border-radius:8px;font-size:16px}
button,.link{display:inline-block;border:0;border-radius:8px;padding:12px;margin:4px 0;background:#16834a;color:white;text-decoration:none;font-size:15px;cursor:pointer}
button{width:100%}
.logout{background:#c0392b}
.contact{background:#16834a}
.whatsapp{background:#159b75}
.waze{background:#1769aa}
h3{margin-top:0;color:#102a43}
.small{color:#666;font-size:13px}
.hidden{display:none!important}
.error{color:#c0392b;white-space:pre-wrap}
</style>
</head>
<body>
<header>
<h2>طلبات المدينة 🛵</h2>
<div>بوابة الموصّلين</div>
</header>
<main>
<section class="box" id="loginBox">
<h3>دخول الموصّل</h3>
<input id="phone" type="tel" placeholder="رقم الهاتف 07XXXXXXXXX">
<input id="password" type="password" placeholder="كلمة المرور">
<button id="loginButton" onclick="login()">تسجيل الدخول</button>
<p id="loginMessage"></p>
</section>

<section id="driverArea" class="hidden">
<div class="box">
<h3 id="driverName">حساب الموصّل</h3>
<p>هذه قائمة الطلبات المسندة إلى حسابك.</p>
<button onclick="loadOrders()">تحديث الطلبات</button>
<button class="logout" onclick="logout()">تسجيل الخروج</button>
</div>
<div id="orders"></div>
</section>
</main>

<script>
const SUPABASE_URL =
"https://iombzxymujzetguqdhkq.supabase.co";

// استخدم نفس مفتاح Publishable الموجود في ملفك السابق
const SUPABASE_KEY = "sb_publishable_dTg1TjFIepJqVTycKHe42A_DW0ZwNT_";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

function normalizePhone(value){
  let p=String(value||"").replace(/\D/g,"");

  if(p.startsWith("00")) p=p.slice(2);
  if(p.startsWith("07")) p="964"+p.slice(1);
  else if(p.startsWith("7")) p="964"+p;

  return p;
}

async function login(){
  const phone=normalizePhone(
    document.getElementById("phone").value
  );
  const password=document.getElementById("password").value;
  const message=document.getElementById("loginMessage");
  const button=document.getElementById("loginButton");

  if(!/^9647\d{9}$/.test(phone)||!password){
    message.textContent="أدخل رقم هاتف عراقي صحيح وكلمة المرور.";
    return;
  }

  const internalEmail =
    phone + "@drivers.talabat-almadina.invalid";

  button.disabled=true;
  message.textContent="جارٍ تسجيل الدخول...";

  try{
    const {error}=await db.auth.signInWithPassword({
      email:internalEmail,
      password:password
    });

    if(error) throw error;

    await showDriver();

  }catch(error){
    message.textContent="تعذر تسجيل الدخول: "+error.message;
  }finally{
    button.disabled=false;
  }
}

async function showDriver(){
  const {data:{user},error:userError}=await db.auth.getUser();

  if(userError||!user){
    showError("تعذر التحقق من الحساب",userError);
    return;
  }

  const {data:profile,error}=await db
    .from("driver_profiles")
    .select("full_name,phone")
    .eq("id",user.id)
    .maybeSingle();

  if(error){
    showError("تعذر قراءة بيانات الموصّل",error);
    return;
  }

  if(!profile){
    alert("لم يتم العثور على بيانات هذا الموصّل.");
    return;
  }

  document.getElementById("driverName").textContent =
    "أهلاً "+profile.full_name;

  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("driverArea").classList.remove("hidden");

  await loadOrders();
}

function showError(title,error){
  alert(
    title+
    "\nرمز الخطأ: "+(error?.code||"غير متوفر")+
    "\nالتفاصيل: "+(error?.message||"غير متوفرة")
  );
}

async function loadOrders(){
  const area=document.getElementById("orders");
  area.textContent="جارٍ تحميل الطلبات...";

  const {data:{user},error:userError}=await db.auth.getUser();

  if(userError||!user){
    area.textContent="يجب تسجيل الدخول أولاً.";
    return;
  }

  const {data,error}=await db
    .from("orders")
    .select("*")
    .eq("driver_id",user.id)
    .order("created_at",{ascending:false});

  if(error){
    area.textContent="تعذر تحميل الطلبات: "+error.message;
    return;
  }

  if(!data||data.length===0){
    area.textContent="ما عندك طلبات مسندة حالياً.";
    return;
  }

  area.innerHTML=data.map(order=>{
    const products=Array.isArray(order.products)
      ? order.products.map(p=>
          typeof p==="string"?p:(p.name||p.title||"منتج")
        ).join("، ")
      : "تفاصيل المنتجات";

    const phone=String(order.customer_phone||"")
      .replace(/\D/g,"");

    const whatsapp=phone.startsWith("0")
      ? "964"+phone.slice(1)
      : phone.startsWith("964")?phone:"";

    const hasLocation=
      order.customer_latitude!=null &&
      order.customer_longitude!=null;

    const waze=hasLocation
      ? "https://waze.com/ul?ll="+
        encodeURIComponent(
          order.customer_latitude+","+order.customer_longitude
        )+"&navigate=yes"
      : "";

    return `
      <div class="order">
        <h3>طلب رقم: ${escapeHTML(order.id)}</h3>
        <p><b>الزبون:</b> ${escapeHTML(order.customer_name||"غير محدد")}</p>
        <p><b>الهاتف:</b> ${escapeHTML(order.customer_phone||"غير محدد")}</p>
        <p><b>العنوان:</b> ${escapeHTML(order.customer_address||"غير محدد")}</p>
        <p><b>المنتجات:</b> ${escapeHTML(products)}</p>
        <p><b>المجموع:</b> ${escapeHTML(order.total??0)} د.ع</p>
        <p><b>أجرة التوصيل:</b> ${escapeHTML(order.delivery_fee??0)} د.ع</p>
        <p><b>الحالة:</b> ${escapeHTML(order.status||"غير محددة")}</p>

        ${phone?`<a class="link contact" href="tel:${encodeURIComponent(phone)}">اتصال بالزبون</a>`:""}

        ${whatsapp?`<a class="link whatsapp" target="_blank" rel="noopener" href="https://wa.me/${whatsapp}">مراسلة واتساب</a>`:""}

        ${waze?`<a class="link waze" target="_blank" rel="noopener" href="${waze}">فتح موقع الزبون في Waze</a>`:"<p class='small'>موقع الزبون غير متوفر</p>"}

        ${order.customer_notes?`<p><b>ملاحظات:</b> ${escapeHTML(order.customer_notes)}</p>`:""}
      </div>
    `;
  }).join("");
}

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

async function logout(){
  await db.auth.signOut();
  location.reload();
}

async function checkSession(){
  const {data:{session}}=await db.auth.getSession();
  if(session) await showDriver();
}

checkSession();
</script>
</body>
</html>
