<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>متاجر طلبات المدينة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f3f5f8}
header{background:#102a43;color:white;text-align:center;padding:20px}
.container{padding:15px}
input{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;font-size:16px;margin-bottom:15px}
.stores{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.store{background:white;padding:18px 10px;text-align:center;border-radius:12px;box-shadow:0 2px 8px #00000012}
.store h3{color:#102a43}
.rating{color:#e6a400;font-size:18px;margin:10px 0}
.rating-count{color:#666;font-size:13px}
button{background:#16834a;color:white;border:0;padding:11px 15px;border-radius:8px;font-size:15px;cursor:pointer}
button:disabled{opacity:.6}
.back{background:#102a43;margin-bottom:15px}
.favorite{background:#f1f1f1;color:#d62950;margin:8px 0;width:100%}
.favorite.saved{background:#ffe5ec;color:#d62950}
.message{background:white;padding:15px;border-radius:10px;text-align:center;grid-column:1/-1}
@media(max-width:350px){.stores{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
<h2>طلبات المدينة</h2>
<p>اختر المتجر الذي تريد الطلب منه</p>
</header>

<div class="container">
<button class="back" onclick="location.href='index.html'">رجوع للأقسام</button>
<h3 id="categoryTitle">المتاجر</h3>
<input id="search" placeholder="ابحث عن متجر..." oninput="showStores()">
<div class="stores" id="stores">
<div class="message">جاري تحميل المتاجر...</div>
</div>
</div>

<script>
const SUPABASE_URL="https://iombzxymujzetguqdhkq.supabase.co";
const SUPABASE_KEY="sb_publishable_dTg1TjFIepJqVTycKHe42A_DW0ZwNT_";

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const params=new URLSearchParams(location.search);
const selectedCategory=(params.get("category")||"").trim();

document.getElementById("categoryTitle").textContent=
selectedCategory||"جميع المتاجر";

let allStores=[];
let currentUser=null;
let favoriteStores=[];

async function loadFavorites(){
  const {data,error}=await db.from("favorites")
    .select("id,item_id,item_name")
    .eq("user_id",currentUser.id)
    .eq("item_type","store");

  if(error) throw error;
  favoriteStores=data||[];
}

function isFavorite(storeId){
  return favoriteStores.some(item=>
    String(item.item_id)===String(storeId)
  );
}

async function toggleFavorite(store,button){
  if(!currentUser){
    alert("يرجى تسجيل الدخول أولاً حتى تحفظ المتاجر في المفضلة");
    location.href="./account.html";
    return;
  }

  button.disabled=true;

  try{
    const existing=favoriteStores.find(item=>
      String(item.item_id)===String(store.id)
    );

    if(existing){
      const {error}=await db.from("favorites")
        .delete()
        .eq("id",existing.id)
        .eq("user_id",currentUser.id);

      if(error) throw error;

      favoriteStores=favoriteStores.filter(item=>
        item.id!==existing.id
      );

      alert("تم حذف المتجر من المفضلة");
    }else{
      const {data,error}=await db.from("favorites")
        .insert({
          user_id:currentUser.id,
          item_type:"store",
          item_id:String(store.id),
          item_name:store.name,
          item_description:store.category||"متجر"
        })
        .select("id,item_id,item_name")
        .single();

      if(error) throw error;
      favoriteStores.push(data);
      alert("تمت إضافة المتجر للمفضلة بنجاح ✓");
    }

    showStores();
  }catch(error){
    alert("تعذر تحديث المفضلة: "+error.message);
    console.error(error);
  }

  button.disabled=false;
}

async function loadStores(){
  const area=document.getElementById("stores");

  try{
    const {data:userData,error:userError}=await db.auth.getUser();
    if(userError) throw userError;

    currentUser=userData.user;

    if(currentUser) await loadFavorites();

    let query=db.from("stores")
      .select("id,name,category,is_active")
      .eq("is_active",true)
      .order("name");

    if(selectedCategory){
      query=query.eq("category",selectedCategory);
    }

    const {data,error}=await query;
    if(error) throw error;

    allStores=data||[];

    const {data:ratings,error:ratingError}=await db.rpc("get_store_ratings");

    if(ratingError) throw ratingError;

    const ratingMap={};

    (ratings||[]).forEach(item=>{
      ratingMap[String(item.store_id)]=item;
    });

    allStores=allStores.map(store=>({
      ...store,
      rating:ratingMap[String(store.id)]||null
    }));

    showStores();

  }catch(error){
    area.innerHTML=
      '<div class="message">تعذر تحميل البيانات: '+
      escapeHTML(error.message)+'</div>';

    console.error(error);
  }
}

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,function(char){
    return {
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[char];
  });
}

function showStores(){
  const search=document.getElementById("search").value.trim();
  const area=document.getElementById("stores");

  const filtered=allStores.filter(store=>
    (store.name||"").includes(search)
  );

  area.innerHTML="";

  if(filtered.length===0){
    area.innerHTML=
      '<div class="message">لا توجد متاجر مفتوحة بهذا القسم حالياً.</div>';
    return;
  }

  filtered.forEach(store=>{
    const card=document.createElement("div");
    card.className="store";

    const name=document.createElement("h3");
    name.textContent=store.name;

    const category=document.createElement("p");
    category.textContent=store.category||"";

    const rating=document.createElement("div");
    rating.className="rating";

    if(store.rating && Number(store.rating.rating_count)>0){
      const average=Number(store.rating.average_rating);
      const count=Number(store.rating.rating_count);

      rating.innerHTML=
        '⭐ '+average.toFixed(1)+' / 5'+
        '<div class="rating-count">('+count+' تقييم)</div>';
    }else{
      rating.innerHTML=
        '⭐ لا توجد تقييمات بعد';
    }

    const favoriteButton=document.createElement("button");
    favoriteButton.className="favorite";

    function updateFavoriteButton(){
      const saved=currentUser&&isFavorite(store.id);
      favoriteButton.textContent=saved?
        "❤️ في المفضلة":
        "♥ إضافة للمفضلة";
      favoriteButton.classList.toggle("saved",!!saved);
    }

    updateFavoriteButton();

    favoriteButton.onclick=function(){
      toggleFavorite(store,favoriteButton);
    };

    const button=document.createElement("button");
    button.textContent="عرض المنتجات";

    button.onclick=function(){
      location.href=
        "products.html?storeId="+encodeURIComponent(store.id)+
        "&store="+encodeURIComponent(store.name);
    };

    card.append(name,category,rating,favoriteButton,button);
    area.appendChild(card);
  });
}

loadStores();
</script>
</body>
</html>
